name: Dependency checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:4313
      STATAMIC_PRO_ENABLED: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: composer validate
      - run: composer audit --locked
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan package:discover
          php artisan statamic:install --no-interaction
      - run: npm ci --ignore-scripts --no-audit
      - name: Dependency audit
        run: npm audit
      - run: npm run production
      - run: php vendor/bin/phpunit
      - name: Serve production assets for browser regression checks
        run: |
          php artisan serve --host=127.0.0.1 --port=4313 > storage/logs/browser-test-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4313/build/manifest.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/browser-test-server.log
          exit 1
      - name: Check custom styles in Chrome
        run: npm run test:browser
        env:
          RUN_BROWSER_TESTS: '1'
          BROWSERSHOT_CHROME_PATH: /usr/bin/google-chrome
      - name: Generate static documentation
        run: php artisan statamic:ssg:generate --no-interaction
      - name: Verify exported Vite assets
        run: npm run test:static
